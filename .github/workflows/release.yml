name: build

on:
  push:
    branches: [main, "26.2"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - run: python setup_vanilla.py
      - run: python build.py
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sky-strata
          path: build/libs/*.jar

      - name: Read version and changelog
        if: startsWith(github.ref, 'refs/tags/v')
        id: release
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version=$version" >&2
            exit 1
          fi
          awk -v v="$version" '/^## /{p = ($2 == v)} p && !/^## /' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=${version%%+*} ($(sed -n 's/^minecraft_version=//p' gradle.properties))" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: Kira-NT/mc-publish@v3.3
        with:
          modrinth-id: 3C0zq5bG
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1759792
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: build/libs/skystrata-${{ steps.release.outputs.version }}.jar
          name: Sky Strata ${{ steps.release.outputs.name }}
          version: ${{ steps.release.outputs.version }}
          version-type: release
          changelog-file: release-notes.md
          loaders: neoforge
          game-versions: 26.2
          java: 25
